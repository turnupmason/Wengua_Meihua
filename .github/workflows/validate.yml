name: Validate knowledge and engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build:data
      - run: git diff --exit-code -- data sources/revised sources/extracted sources/commentary sources/review
      - run: npm run validate
      - run: npm run validate:details
      - run: npm run validate:stories
      - run: npm run validate:timing
      - run: npm run validate:questions
      - run: npm run validate:receivable
      - run: npm run validate:product
      - run: npm run validate:authored
      - run: npm test
  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
