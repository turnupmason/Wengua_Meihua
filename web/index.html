<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问卦 · 梅花资料联调</title><link rel="stylesheet" href="/web/style.css"></head>
<body><main><header><p class="eyebrow">WENGUA / MEIHUA</p><h1>静心观象</h1><p>卦象、动爻与古籍资料联调演示</p></header>
<form id="controls">
<label>领域<select id="domain" required></select></label>
<label>细分类型<select id="subcategory" required></select></label>
<label>具体问题<select id="question-item" required></select></label>
<div id="context-fields" class="context-fields"></div>
<label data-chart-control>本卦<select id="primary"></select></label>
<label data-chart-control>动爻<select id="moving"><option value="1">初爻 · 最下方</option><option value="2">二爻</option><option value="3">三爻</option><option value="4">四爻</option><option value="5">五爻</option><option value="6">上爻 · 最上方</option></select></label>
<label data-chart-control>月令<select id="month"><option value="">待提供</option></select></label>
<label data-chart-control>起卦日期（联调）<input id="casting-date" type="date" required></label>
<label data-chart-control>取期依据（联调）<select id="timing-method"><option value="pre-heaven-demo">演示 · 先天卦气</option><option value="manual">手动盘 · 原法未记录</option></select></label>
<label data-chart-control>日干支<input id="ganzhi" maxlength="2" placeholder="如甲子" value="甲子"></label>
<button id="view-button">查看卦象</button></form>
<p id="question-note" aria-live="polite">选择一个具体事项，一次只问一件事。</p>
<p id="error" role="alert"></p><section class="stone" aria-label="本卦互卦变卦"><div id="roles"></div><div id="panels"></div><p id="relation"></p></section>
<details id="story-panel"><summary id="story-label">展开本次解读</summary><div id="story" class="prose"></div><div id="case-links"></div></details>
<section class="detail"><h2 id="detail-title">卦意</h2><div id="detail"></div></section>
<details id="context-panel"><summary>月令与全盘生克</summary><div id="context"></div></details>
<details id="source-panel"><summary>所选事项的古籍来源</summary><div id="domain-text" class="prose"></div></details>
<footer>本页为卦象与资料演示，传统解释供文化体验与参考。</footer>
</main><script type="module" src="/web/app.js"></script></body></html>
